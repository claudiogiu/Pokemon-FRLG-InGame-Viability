[source]
base_url = "https://raw.githubusercontent.com/PokeAPI/api-data"
commit = "9c965567b7a2a717fb8a391c4ddbc8e168f41124"
api_prefix = "data/api/v2"
document_name = "index.json"
timeout_seconds = 30.0
worker_count = 16
generation_index = 3
versions = ["firered", "leafgreen"]
pokedex_limit = 151
sprite_version = "firered-leafgreen"
sprite_repository = "PokeAPI/sprites"
sprite_commit = "c0542f7c51215d9672439012838c99f520596cbd"

[pret]
base_url = "https://raw.githubusercontent.com/pret/pokefirered"
commit = "ce6406d8c2eaf46d543c8a2606de0c3cb1951982"
species_file = "src/data/pokemon/species_info.h"
level_up_file = "src/data/pokemon/level_up_learnsets.h"
level_up_pointer_file = "src/data/pokemon/level_up_learnset_pointers.h"
tmhm_file = "src/data/pokemon/tmhm_learnsets.h"
tutor_file = "src/data/pokemon/tutor_learnsets.h"
moves_file = "src/data/battle_moves.h"
parties_file = "src/data/trainer_parties.h"

[campaign]
player_iv = 15
player_ev = 0
trainer_iv_scale = 255
maximum_iv = 31
default_move_count = 4
damage_roll_mean = 0.925
stab_multiplier = 1.5
intimidate_multiplier = 0.6667
league_player_level = 54
turn_weight = 0.5
sleep_free_turns = 2.0
paralysis_speed_factor = 0.25
paralysis_action_rate = 0.75
maximum_setup_uses = 2

[population]
excluded_species = ["mew", "mewtwo", "ditto"]

[calibration]
battle_features = ["battle_quality", "total_contribution"]
ease_features = ["battles_available_share", "final_form_level", "experience_to_level_50", "acquisition_effort", "requires_trade"]
negative_features = ["final_form_level", "experience_to_level_50", "acquisition_effort", "requires_trade"]
regularization = 1.0
target = "smogon_tier_score"

[axes]
x_feature = "cross_validated_score"
x_label = "Estimated Strength"
y_feature = "contribution_earliness"
y_label = "Contribution Timing"
quadrant_labels = ["Avoid", "Late Bloomers", "Early Fillers", "Team Pillars"]

[dataset]
lines_name = "kanto_lines.parquet"
battles_name = "major_battles.parquet"

[report]
title = "Which Pokémon Carry a FireRed And LeafGreen Run"
subtitle = "Strength And Contribution Timing Across the Major Battles"
figure_name = "FRLG_Viability.png"
results_name = "viability_estimates.parquet"
figure_dpi = 400
sprite_zoom = 0.64
figure_width = 11.0
figure_height = 9.0

[fonts]
base_url = "https://raw.githubusercontent.com/IBM/plex"
commit = "bc6a7e4b37634eb79785d59781893db63ee3edcb"
